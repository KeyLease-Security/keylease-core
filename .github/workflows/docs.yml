name: Docs

# Builds the KeyLease documentation site for this Soroban repository with
# MkDocs Material and publishes it to GitHub Pages.
#
# GitHub Pages for this repository is served from the `gh-pages` branch
# (Settings → Pages → Source: "Deploy from a branch" → gh-pages / root). This
# workflow force-pushes a fresh orphan commit of the built site there on every
# change to docs/, so the branch is generated output and never hand-edited.
#
# Local preview:
#   pip install -r requirements-docs.txt && mkdocs serve

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: true

jobs:
  build-deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install docs dependencies
        run: pip install -r requirements-docs.txt

      - name: Build site
        run: mkdocs build --strict

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          # Keep the branch a single generated commit instead of growing a
          # history of built HTML on every docs change.
          force_orphan: true

      # GitHub Pages is configured with build_type: workflow, so the branch
      # push above alone does not publish anything — the site must be deployed
      # through the Pages API or the live site never updates.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    name: Deploy
    needs: build-deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
