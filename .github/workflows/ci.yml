name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
      - name: Check every tracked shell script
        run: |
          set -euo pipefail
          shellcheck --version
          # The file list comes from the index, not a working-tree glob: a script
          # that is tracked but moved out of scripts/ still has to be linted.
          scripts=()
          while IFS= read -r -d '' file; do
            scripts+=("$file")
          done < <(git ls-files -z '*.sh')
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "::error::No tracked *.sh files matched; this check would pass without covering anything"
            exit 1
          fi
          printf 'checking %d script(s):\n' "${#scripts[@]}"
          printf '  %s\n' "${scripts[@]}"
          shellcheck "${scripts[@]}"

  shell-tests:
    name: Shell Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bats
      # The suite lives in tests/ and stubs gh, stellar, cargo and rustup on
      # PATH (tests/stubs), so it needs no network, credentials or toolchain.
      - name: Run the shell script tests
        run: bats --tap tests

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      # The host run above lints tests and the std/testutils build. This one
      # lints the artifact that is actually deployed: the contracts compiled
      # no_std for the Soroban target in release, against the SDK's guest
      # environment instead of the host one. It stays in this job so the
      # "Clippy" required check name in branch protection does not change.
      - name: cargo clippy (wasm32v1-none)
        run: cargo clippy --target wasm32v1-none --release --all -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --all

  wasm:
    name: Build (wasm32v1-none)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - name: Build Soroban contracts
        run: cargo build --target wasm32v1-none --release --all
      # Fails if a contract crate drops #![no_std] or its unsafe_code lints,
      # if the target ever ships a std to link, or if a built .wasm imports
      # anything but Soroban host functions or carries std source paths.
      # Kept in this job so the required check name does not change.
      - name: Check Wasm is built without std
        run: ./scripts/check-no-std.sh --no-build
      - name: Generate Wasm checksums
        run: |
          set -euo pipefail
          (
            cd target/wasm32v1-none/release
            sha256sum keylease_registry.wasm keylease_mock_token.wasm > SHA256SUMS
            cat SHA256SUMS
          )
      - name: Upload Wasm and checksums
        uses: actions/upload-artifact@v7
        with:
          # The commit in the name makes it easy to match an artifact to a PR.
          name: wasm-${{ github.sha }}
          path: |
            target/wasm32v1-none/release/keylease_registry.wasm
            target/wasm32v1-none/release/keylease_mock_token.wasm
            target/wasm32v1-none/release/SHA256SUMS
          if-no-files-found: error
      - name: Verify reproducible Wasm build
        run: |
          set -euo pipefail
          first_registry="$(sha256sum target/wasm32v1-none/release/keylease_registry.wasm | awk '{print $1}')"
          first_mock="$(sha256sum target/wasm32v1-none/release/keylease_mock_token.wasm | awk '{print $1}')"
          echo "first build  keylease_registry.wasm:    $first_registry"
          echo "first build  keylease_mock_token.wasm: $first_mock"
          cargo clean --target wasm32v1-none --release
          cargo build --target wasm32v1-none --release --all
          second_registry="$(sha256sum target/wasm32v1-none/release/keylease_registry.wasm | awk '{print $1}')"
          second_mock="$(sha256sum target/wasm32v1-none/release/keylease_mock_token.wasm | awk '{print $1}')"
          echo "second build keylease_registry.wasm:    $second_registry"
          echo "second build keylease_mock_token.wasm: $second_mock"
          if [ "$first_registry" != "$second_registry" ] || [ "$first_mock" != "$second_mock" ]; then
            echo "::error::Release Wasm build is not reproducible"
            echo "keylease_registry.wasm:    first=$first_registry second=$second_registry"
            echo "keylease_mock_token.wasm:  first=$first_mock second=$second_mock"
            exit 1
          fi
          echo "Reproducible Wasm hash (keylease_registry.wasm): $first_registry"
          echo "Compare with the Wasm hash recorded in docs/deployments.md."

  spellcheck:
    name: Spell Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Docs, README and Rust comments, over every tracked file. The version is
      # pinned to match the tool contributors run locally, and `_typos.toml` in
      # the repository root holds the project dictionary, so a local `typos` run
      # reports exactly what this job reports. Findings fail the job.
      - uses: crate-ci/typos@v1.52.2

  markdown:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Globs and rule settings come from `.markdownlint-cli2.jsonc`, the same
      # file `markdownlint-cli2` reads in the repository root. Headings, links
      # and list style are checked here; `mkdocs build --strict` (docs.yml)
      # keeps checking navigation and anchors.
      - uses: DavidAnson/markdownlint-cli2-action@v25

  deny:
    name: Dependency Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Checks the committed Cargo.lock against deny.toml: RustSec advisories,
      # license allow-list, wildcard/git dependencies and unknown registries.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  malware-scan:
    name: Malware Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The checkout only needs to be read; do not leave the job token in
      # .git/config for the scanners to read.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install ClamAV
        run: |
          sudo apt-get update
          # `clamav` provides clamscan; `clamav-freshclam` provides freshclam.
          sudo apt-get install -y --no-install-recommends clamav clamav-freshclam
          # The packaged service may already be updating the signature
          # database and would hold the freshclam lock.
          sudo systemctl stop clamav-freshclam.service 2>/dev/null || true
          sudo pkill -f freshclam 2>/dev/null || true

      - name: Update virus signatures
        run: |
          for attempt in 1 2 3; do
            if sudo freshclam --quiet --log=/tmp/freshclam.log; then
              exit 0
            fi
            echo "freshclam attempt ${attempt} failed; retrying in 10s" >&2
            sleep 10
          done
          echo "::error::Could not download ClamAV signatures; refusing to run a stale scan"
          exit 1

      - name: Scan repository
        run: |
          set -o pipefail
          clamscan --version
          clamscan \
            --recursive \
            --infected \
            --exclude-dir='^\.git$' \
            --exclude-dir='^target$' \
            --exclude-dir='^site$' \
            --exclude-dir='^node_modules$' \
            --max-filesize=100M \
            --max-scansize=500M \
            . | tee clamav-report.txt

      # Scan the exact Wasm artifacts this repo would deploy, not just source.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - name: Build Soroban contracts
        run: cargo build --target wasm32v1-none --release --all

      - name: Scan built Wasm artifacts
        run: |
          set -o pipefail
          shopt -s nullglob
          wasm=(target/wasm32v1-none/release/*.wasm)
          if [ "${#wasm[@]}" -eq 0 ]; then
            echo "::error::No Wasm artifacts were produced"
            exit 1
          fi
          clamscan --infected "${wasm[@]}" | tee -a clamav-report.txt

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clamav-report
          path: clamav-report.txt
          if-no-files-found: ignore
