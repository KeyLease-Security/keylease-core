name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --all

  wasm:
    name: Build (wasm32v1-none)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - name: Build Soroban contracts
        run: cargo build --target wasm32v1-none --release --all

  rustdoc:
    # Stable check name: branch protection requires `Rustdoc`, so renaming this
    # job orphans the requirement instead of moving it.
    name: Rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Intra-doc links, undocumented public items and manifest metadata problems
      # all become errors here, which is what `cargo doc` otherwise never reports.
      # `--document-private-items` is part of the gate, not an accident: private
      # modules are where the storage and event layout lives, and links into them
      # have to keep resolving too.
      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --document-private-items

  spellcheck:
    name: Spell Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Docs, README and Rust comments, over every tracked file. The version is
      # pinned to match the tool contributors run locally, and `_typos.toml` in
      # the repository root holds the project dictionary, so a local `typos` run
      # reports exactly what this job reports. Findings fail the job.
      - uses: crate-ci/typos@v1.52.2

  markdown:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Globs and rule settings come from `.markdownlint-cli2.jsonc`, the same
      # file `markdownlint-cli2` reads in the repository root. Headings, links
      # and list style are checked here; `mkdocs build --strict` (docs.yml)
      # keeps checking navigation and anchors.
      - uses: DavidAnson/markdownlint-cli2-action@v25

  actionlint:
    name: Action Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # actionlint is a binary, not an action, so the release is fetched by an
      # explicit version and its checksum verified against the release's own
      # checksums file. That keeps the linter version a reviewable constant in
      # this file instead of whatever `latest` happens to mean today.
      - name: Install actionlint
        run: |
          set -euo pipefail
          version=1.7.12
          archive="actionlint_${version}_linux_amd64.tar.gz"
          base="https://github.com/rhysd/actionlint/releases/download/v${version}"
          curl -sSfL -o "/tmp/${archive}" "${base}/${archive}"
          curl -sSfL -o /tmp/actionlint-checksums.txt "${base}/actionlint_${version}_checksums.txt"
          (
            cd /tmp
            grep -E "^[0-9a-f]{64}  ${archive}\$" actionlint-checksums.txt | sha256sum --check --status
          )
          tar -xzf "/tmp/${archive}" -C /tmp actionlint
      # actionlint hands every inline `run:` script to shellcheck and skips that
      # rule silently when the binary is missing, so it is installed here rather
      # than trusted to be present on the runner image.
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
      # No paths filter: a workflow file can be broken by any PR that edits one,
      # and this job is only useful if it also catches the ones nobody touched.
      # With no arguments actionlint lints every file under .github/workflows.
      - name: Lint every workflow file
        run: /tmp/actionlint -no-color

  deny:
    name: Dependency Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Checks the committed Cargo.lock against deny.toml: RustSec advisories,
      # license allow-list, wildcard/git dependencies and unknown registries.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  malware-scan:
    name: Malware Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The checkout only needs to be read; do not leave the job token in
      # .git/config for the scanners to read.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install ClamAV
        run: |
          sudo apt-get update
          # `clamav` provides clamscan; `clamav-freshclam` provides freshclam.
          sudo apt-get install -y --no-install-recommends clamav clamav-freshclam
          # The packaged service may already be updating the signature
          # database and would hold the freshclam lock.
          sudo systemctl stop clamav-freshclam.service 2>/dev/null || true
          sudo pkill -f freshclam 2>/dev/null || true

      - name: Update virus signatures
        run: |
          for attempt in 1 2 3; do
            if sudo freshclam --quiet --log=/tmp/freshclam.log; then
              exit 0
            fi
            echo "freshclam attempt ${attempt} failed; retrying in 10s" >&2
            sleep 10
          done
          echo "::error::Could not download ClamAV signatures; refusing to run a stale scan"
          exit 1

      - name: Scan repository
        run: |
          set -o pipefail
          clamscan --version
          clamscan \
            --recursive \
            --infected \
            --exclude-dir='^\.git$' \
            --exclude-dir='^target$' \
            --exclude-dir='^site$' \
            --exclude-dir='^node_modules$' \
            --max-filesize=100M \
            --max-scansize=500M \
            . | tee clamav-report.txt

      # Scan the exact Wasm artifacts this repo would deploy, not just source.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - name: Build Soroban contracts
        run: cargo build --target wasm32v1-none --release --all

      - name: Scan built Wasm artifacts
        run: |
          set -o pipefail
          shopt -s nullglob
          wasm=(target/wasm32v1-none/release/*.wasm)
          if [ "${#wasm[@]}" -eq 0 ]; then
            echo "::error::No Wasm artifacts were produced"
            exit 1
          fi
          clamscan --infected "${wasm[@]}" | tee -a clamav-report.txt

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clamav-report
          path: clamav-report.txt
          if-no-files-found: ignore
