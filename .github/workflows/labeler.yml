name: Labeler

# Adds path labels (.github/labeler.yml) to pull requests so maintainers can
# triage by area.
#
# `pull_request_target` runs this workflow and reads the label config from the
# base branch, with a token that can write labels even on PRs from forks.
# That is safe here because nothing from the PR is checked out or executed:
# actions/labeler only lists the PR's changed file names through the API and
# matches them against the base branch's config.
# Do not add an actions/checkout step to this workflow.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

# No permissions by default; the job asks for exactly what it uses.
permissions: {}

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Label by path
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read        # read .github/labeler.yml from the base branch
      pull-requests: write  # list changed files, set labels on the PR
    steps:
      # Pinned to the full commit SHA of the v7.0.0 tag, not the movable tag.
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .github/labeler.yml
          sync-labels: false
