# MkDocs configuration for the KeyLease documentation site.
#
# The site is built from docs/ and published to GitHub Pages by
# .github/workflows/docs.yml. Preview locally with:
#
#   pip install -r requirements-docs.txt
#   mkdocs serve
#
# The `nav` below is the single table of contents for the site; docs/SUMMARY.md
# is kept only for readers who browse the repository directly.

site_name: KeyLease
site_description: Time-bound, ephemeral micro-leases for API & RPC providers on Stellar/Soroban.
site_url: https://keylease-security.github.io/keylease-core/
repo_url: https://github.com/KeyLease-Security/keylease-core
repo_name: KeyLease-Security/keylease-core
edit_uri: edit/main/docs/
copyright: MIT © 2026 KeyLease Security

docs_dir: docs
strict: true

exclude_docs: |
  SUMMARY.md

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Overview:
      - Introduction: introduction.md
      - Architecture: architecture.md
  - Protocol:
      - How the protocol works: protocol.md
      - Contract reference: contract-reference.md
      - Security model: security.md
  - Gateway:
      - Overview: gateway/index.md
      - CLI reference: gateway/cli.md
      - Proxy: gateway/proxy.md
      - Session tokens: gateway/session-tokens.md
  - Guides:
      - Provider guide: provider-guide.md
      - Consumer guide: consumer-guide.md
      - Developer guide: developer-guide.md
      - Deployment: deployment.md
      - Hosting topology: hosting-topology.md
  - Project:
      - Deployments: deployments.md
      - Release notes: releases/v0.1.0.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

validation:
  nav:
    omitted_files: warn
  links:
    anchors: warn
