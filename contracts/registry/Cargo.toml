[package]
name = "keylease-registry"
description = "KeyLease registry: time-bound, ephemeral micro-lease escrow for API/RPC providers on Stellar/Soroban."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
rust-version.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
stellar-xdr = { version = "=26.0.1", default-features = false, features = ["curr", "std", "serde"] }
serde_json = "1"
keylease-mock-token = { path = "../mock_token", version = "0.3.0" }

[features]
testutils = ["soroban-sdk/testutils"]
