[package]
name = "keylease-mock-token"
description = "Minimal SEP-41 test token used by the KeyLease registry integration tests."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
rust-version.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]

# `keylease_doc_lint` is set only by scripts/check-missing-docs.sh.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(keylease_doc_lint)"] }
